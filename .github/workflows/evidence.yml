name: Evidence

# What CI cannot run: the tests that download models from the HF hub, the
# reference parity matrix, and experiments on real weights. RELEASING.md
# requires the first two before a tag, and until now they had only ever run
# on someone's machine, with nothing but a PR body to show for it.
#
# Every result is printed into the job log with its sha256 as well as
# uploaded: a reader who cannot fetch artifacts can still check a copy of a
# result against the log it came from.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/evidence.yml"
      - "experiments/**"

concurrency:
  group: evidence-${{ github.ref }}
  cancel-in-progress: true

# Declared rather than inherited, as in ci.yml.
permissions:
  contents: read

jobs:
  network-tests:
    name: pytest -m network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the locked environment
        # The lock, not requirements.txt: evidence is only worth something
        # against versions someone can install again. transformer-lens is
        # pinned because without it test_hooked and test_external skip.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock "transformer-lens==3.9.0" \
              --extra-index-url https://download.pytorch.org/whl/cpu
          git rev-parse HEAD 'HEAD^{tree}'
          python --version; node --version
          pip freeze

      - name: Network tests
        run: pytest -m network -q -rA --junitxml=network.xml

      - name: No silent skips
        # A missing optional dependency skips a test and the run still exits
        # 0, which would let this job pass on tests that never ran.
        run: |
          python -c "import xml.etree.ElementTree as E; s = E.parse('network.xml').getroot().find('testsuite'); print(dict(s.attrib)); raise SystemExit(int(s.get('skipped')) > 0)"

  parity:
    name: mottled parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install with the reference frameworks
        # Pinned to what the extras resolve to today; #57 ran nnsight 0.7.0,
        # so a failure on 0.8.0 is a finding about the shipped extra.
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements.lock ".[models,tlens,nnsight]" \
              "transformer-lens==3.9.0" "nnsight==0.8.0" \
              --extra-index-url https://download.pytorch.org/whl/cpu
          git rev-parse HEAD 'HEAD^{tree}'
          python --version
          pip freeze

      - name: Parity matrix
        # Report.passed ignores skipped cells, so a missing reference
        # framework would still exit 0: the jq check requires all nine cells
        # present, run and within tolerance.
        run: |
          status=0
          mottled parity -o parity.json --markdown parity.md || status=$?
          cat parity.md
          cat parity.json
          sha256sum parity.json parity.md
          jq -e '.tolerance as $t | (.comparisons | length) == 9 and all(.comparisons[];
            .status == "ok" and ((.state_max_rel // 0) <= $t) and ((.logit_max_abs // 0) <= $t))' \
            parity.json || status=1
          exit $status

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: parity
          path: parity.*
