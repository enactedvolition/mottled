# requirements.lock — direct dependencies pinned to the exact versions the
# test suite runs against (Python 3.11), for reproducible installs. ci.yml
# installs requirements.txt's floors instead; evidence.yml installs this.
# Transitive versions resolve normally; this pins the top-level surface the
# code is verified on. Regenerate after bumping any dependency.
#
# torch here is the CPU wheel; install it with its index:
#   pip install -r requirements.lock \
#       --extra-index-url https://download.pytorch.org/whl/cpu
#
# For a plain install prefer `pip install mottled[models]` (see pyproject.toml
# for supported version floors). The core five cover analysis and the viewers;
# capture needs the models extra.

# --- core (always required) ---
