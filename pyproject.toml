[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mottled"
version = "0.3.0"
description = "Interactive latent trajectory explorer for transformer forward passes"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["interpretability", "mechanistic-interpretability", "transformers",
            "visualization", "sae", "residual-stream"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
]
# Lower-bound floors; requirements.lock pins the exact known-good closure.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "plotly>=5.18",
    "streamlit>=1.30",
]

[project.optional-dependencies]
# Real transformer captures. Optional only because a viewer, an analysis or a
# .mtj consumer needs none of it — capture does.
models = ["torch>=2.1", "transformers>=4.44"]
# Stream a checkpoint that never lands on local disk (remote.py).
remote = ["requests>=2.28", "safetensors>=0.4"]
umap = ["umap-learn>=0.5"]
faiss = ["faiss-cpu>=1.7"]
# Ecosystem interop (optional): TransformerLens producer, SAELens conversion.
tlens = ["transformer-lens>=1.14"]
sae = ["sae-lens>=3.0"]
# NNsight producer + the `mottled parity` cell that checks it. Optional and
# not in requirements.txt: it pulls ~28 packages (ipython, socketio,
# accelerate, pydantic), which is a lot of CI for one comparison — unlike
# `gguf`, which is there precisely because it is light.
nnsight = ["nnsight>=0.4"]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/enactedvolition/mottled"
Documentation = "https://github.com/enactedvolition/mottled#readme"

[project.scripts]
mottled = "cli:main"
mottled-convert-sae = "convert_sae:main"

[tool.setuptools]
# Every top-level module, checked against the tree by tests/test_packaging.py:
# `attractor` and `mweights` were missing here, which left a pip-installed
# Mottled unable to `import ui` at all — the explorer, the flat API and
# `mottled serve` all failed on an install that looked fine in a clone.
py-modules = ["attractor", "blast", "bvh", "cache", "capture", "cli", "codegen",
              "compare", "config", "convert_sae", "crossmodel", "density", "design_tokens",
              "dose", "intervene", "metrics", "mtjschema", "mweights", "neighbors", "parity",
              "pipeline", "projection", "provenance", "remote", "render", "sae",
              "serve", "smoke", "statefile", "stream", "terrain", "trajectory",
              "ui"]
# `viewer` ships as package data, not just as repo content: serve.py resolves
# its static root next to itself, so without this a pip-installed `mottled
# serve` answers 404 for the very URL it prints. The samples come along
# because the viewer's default scenes are `?file=samples/...`.
# `viewer.samples` is listed too: setuptools recognises it as a package and
# warns that a glob-only include is ambiguous — which is how a bundled sample
# quietly stops shipping two setuptools versions from now.
packages = ["models", "viewer", "viewer.samples"]

[tool.setuptools.package-data]
viewer = ["*.js", "*.html", "*.css"]
"viewer.samples" = ["*.mtj"]
